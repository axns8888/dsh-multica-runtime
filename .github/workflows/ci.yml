name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Install pinned pnpm and build an audited package
        shell: pwsh
        run: |
          $pnpmEntry = & ./scripts/prepare-pnpm.ps1
          ./scripts/build-release.ps1 -PnpmEntry $pnpmEntry
      - name: Exercise install protection and rollback with fixtures
        shell: pwsh
        run: |
          $pkg = Get-ChildItem artifacts/*/*.tgz
          ./scripts/test-release-tools.ps1 -Package $pkg.FullName -Checksums (Join-Path $pkg.DirectoryName 'SHA256SUMS.txt') -ReportPath artifacts/tools-tests.json
